name: Build

# Builds, renders and packages the app. Tests are in test.yml and the static checks in static.yml
# (ADR 0103). Skipped when a change touches only prose or the Homebrew cask.
on:
  push:
    branches: [main]
    paths-ignore: &skipped
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'Casks/**'
  pull_request:
    paths-ignore: *skipped

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; beuve targets macOS (ADR 0049).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 for native Temporal in tests and tooling (ADR 0060).
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The app and the test-only pages (dist-test/, never packaged): the hostile-input harness
      # renders the shared corpus with the production CSP and Trusted Types policy (ADR 0077), and
      # the gallery shows every UI primitive (ADR 0115).
      - name: Build the app, the hostile-input harness and the primitives gallery
        run: node scripts/build.ts --hostile-harness --gallery
      - name: Render the hostile-input corpus in the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's AppArmor denies Chromium's sandbox the unprivileged user namespaces it
          # needs; allow them rather than run Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      - name: Render the hostile-input corpus in the built app (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      # The terminal panel runs a real shell through node-pty in the built app, under the production
      # policy: typing, output, the checkout, replay after hiding the panel (ADR 0095).
      - name: Run a shell in the built app's terminal panel (Linux)
        if: runner.os == 'Linux'
        run: |
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-terminal.ts --screenshots "$RUNNER_TEMP/terminal"
      - name: Run a shell in the built app's terminal panel (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-terminal.ts --screenshots "$RUNNER_TEMP/terminal"
      # Language-server diagnostics (ADR 0111): a type error in a generated TypeScript repository is
      # counted in its card's header, underlined on exactly its text and explained on hover.
      - name: Show language-server diagnostics in the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-diagnostics.ts --screenshots "$RUNNER_TEMP/diagnostics"
      - name: Show language-server diagnostics in the built app (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-diagnostics.ts --screenshots "$RUNNER_TEMP/diagnostics"
      # Every UI primitive in light and dark and each diff color scheme, under the production
      # policy, with its menu open and the focus ring showing (ADR 0115).
      - name: Render the primitives gallery (Linux)
        if: runner.os == 'Linux'
        run: |
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-gallery.ts --screenshots "$RUNNER_TEMP/gallery"
      - name: Render the primitives gallery (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-gallery.ts --screenshots "$RUNNER_TEMP/gallery"
      # The packaged app with the runAsNode fuse off and the bundled Node (ADR 0083-0085).
      - name: Package for Linux and check its fuses and bundled Node
        if: runner.os == 'Linux'
        run: |
          npm run dist:linux-dir
          npm run check:packaged -- --app out/linux-unpacked
          du -sh out/linux-unpacked out/linux-unpacked/resources/node/node
      - name: Package for macOS, verify signatures, fuses and bundled Node
        if: runner.os == 'macOS'
        env:
          # electron-builder skips signing in pull request builds, which leaves Electron's own
          # signature broken by the edits and fails the signature check below. This job has no
          # certificate or secrets, so the flag only makes pull requests get the same ad-hoc
          # signing that pushes get (ADR 0048).
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          npm run dist:mac
          app=out/mac-arm64/beuve.app
          npm run check:signatures -- --app "$app"
          npm run check:packaged -- --app "$app"
          ls -l out/*.dmg out/*.zip
          du -sh "$app" "$app/Contents/Resources/node/node"
      # Uploaded on every run: the gallery is for looking at.
      - name: Upload the gallery screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/gallery
          if-no-files-found: ignore
      - name: Upload the hostile-render screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-render-screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/hostile-render
          if-no-files-found: ignore
      - name: Upload the terminal screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/terminal
          if-no-files-found: ignore
