name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: audit
    permissions:
      contents: read
    # actionlint (1.7.12) rejects the `$/` syntax zizmor's self-repository audit asks for; revisit
    # when it accepts it: https://github.com/rhysd/actionlint/issues/760
    uses: ./.github/workflows/audit.yml # zizmor: ignore[self-repository]

  build:
    name: build
    permissions:
      contents: read
    # Apple silicon runner; beuve ships arm64 only (ADR 0048, 0049).
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: this workflow publishes artifacts, so a poisoned cache would ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Resolve the version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Calendar versions v<year>.<month>.<n>, no leading zeros (ADR 0049).
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*$'; then
              echo "::error::tag $GITHUB_REF_NAME is not v<year>.<month>.<n> (for example v2026.10.1); create tags with 'npm run release'"
              exit 1
            fi
            if [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg; delete the tag and use 'npm run release'"
              exit 1
            fi
            version="$pkg"
          else
            version="$pkg-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building beuve $version"
      - run: npm ci
      # No secrets: an ad-hoc signed, unnotarized build for personal use (docs/packaging.md). To
      # sign and notarize, add the CSC_* and APPLE_* secrets and pass them here as `env`.
      - name: Build the dmg and zip
        env:
          BEUVE_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: npm run dist:mac
      - name: Verify signatures, fuses and the bundled Node (ADR 0083-0085)
        run: |
          app=out/mac-arm64/beuve.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/Resources/node/node"
          npm run check:packaged -- --app "$app"
      - name: Checksums
        working-directory: out
        run: |
          shasum -a 256 ./*.dmg ./*.zip | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 2 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beuve-${{ steps.version.outputs.version }}-mac-arm64
          path: |
            out/*.dmg
            out/*.zip
            out/SHA256SUMS
          if-no-files-found: error

  release:
    name: release
    permissions:
      contents: write # create the GitHub Release and push the cask bump to main
    # Tags only; an untagged run stops at the uploaded artifact.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beuve-${{ needs.build.outputs.version }}-mac-arm64
          path: ${{ runner.temp }}/assets
      - name: Publish the GitHub Release
        run: |
          node scripts/release-notes.ts > "$RUNNER_TEMP/notes.md"
          flags=()
          # Calendar releases never have a suffix; only -dev builds would be prereleases.
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/assets/* \
            --verify-tag --title "beuve $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
      - name: Update the Homebrew cask on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in *-*) echo "Prerelease: leaving the cask alone"; exit 0 ;; esac
          # The checkout keeps no credentials; git gets the token from the environment here only.
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          # Hash what users download, not what we built.
          gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --dir "$RUNNER_TEMP/published"
          sha=$(sha256sum "$RUNNER_TEMP"/published/*.zip | cut -d' ' -f1)
          grep -q "^$sha  .*\.zip$" "$RUNNER_TEMP/assets/SHA256SUMS"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/update-cask.ts "$VERSION" "$sha"
          if git diff --quiet; then echo "Cask already current"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(cask): beuve $VERSION"
          # A GITHUB_TOKEN push starts no workflow runs, and releases come from tags only, so
          # this commit can't loop.
          for _ in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1

  verify-cask:
    name: verify-cask
    permissions: {}
    needs: [build, release]
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Install from the tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          brew tap bdchauvette/beuve https://github.com/bdchauvette/beuve
          brew install --cask bdchauvette/beuve/beuve
          test -d /Applications/beuve.app
          codesign --verify --deep --strict /Applications/beuve.app
          brew uninstall --cask bdchauvette/beuve/beuve
