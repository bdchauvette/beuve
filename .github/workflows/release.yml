name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # Apple silicon runner; beuve ships arm64 only (ADR 0048).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # No secrets: an ad-hoc signed, unnotarized build for personal use (docs/packaging.md). To
      # sign and notarize, add the CSC_* and APPLE_* secrets and pass them here as `env`.
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: beuve-mac-arm64
          path: |
            out/*.dmg
            out/*.zip
          if-no-files-found: error
      - name: Draft a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.dmg out/*.zip --draft --generate-notes --title "beuve $GITHUB_REF_NAME"
