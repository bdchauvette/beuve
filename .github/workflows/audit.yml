name: Audit

# Blocks on high or critical advisories. Only the lockfile is read, so there is no install. Runs when
# dependencies change and weekly, not on every change: a new advisory should not fail unrelated
# pull requests (ADR 0103).
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/audit.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/audit.yml']
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  # release.yml calls this, so a release waits on a fresh audit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # devEngines makes npm refuse any other Node, so use the pinned one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run audit:ci
