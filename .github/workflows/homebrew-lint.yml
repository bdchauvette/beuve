name: Homebrew lint

# Only when the cask or this workflow changes. Style and audit read the cask file and need no
# macOS, so the cheaper Linux runner does it (ADR 0049 amendment).
on:
  push:
    branches: [main]
    paths: ['Casks/**', '.github/workflows/homebrew-lint.yml']
  pull_request:
    paths: ['Casks/**', '.github/workflows/homebrew-lint.yml']

permissions:
  contents: read

concurrency:
  group: homebrew-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    name: cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Homebrew cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          # Audit needs the cask inside a tap: tap this checkout.
          brew tap bdchauvette/beuve "$PWD"
          # Homebrew 7.0.11 refuses to load casks from an untrusted tap.
          brew trust bdchauvette/beuve
          brew style --cask bdchauvette/beuve/beuve
          brew audit --cask --strict bdchauvette/beuve/beuve
