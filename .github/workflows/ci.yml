name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 45's Node (ADR 0007, 0048).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
