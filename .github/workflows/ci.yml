name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; beuve targets macOS (ADR 0049).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 26 for native Temporal in tests and tooling (ADR 0060).
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Render hostile file names and contents in the built app (ADR 0077)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's AppArmor denies Chromium's sandbox the unprivileged user namespaces it
          # needs; allow them rather than run Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run build
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      # The packaged app with the runAsNode fuse off and the bundled Node (ADR 0083-0085).
      - name: Package for Linux and check its fuses and bundled Node
        if: runner.os == 'Linux'
        run: |
          npm run dist:linux-dir
          npm run check:packaged -- --app out/linux-unpacked
          du -sh out/linux-unpacked out/linux-unpacked/resources/node/node
      - name: Package for macOS, verify signatures, fuses and bundled Node
        if: runner.os == 'macOS'
        run: |
          npm run dist:mac
          app=out/mac-arm64/beuve.app
          node=$app/Contents/Resources/node/node
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$node"
          # Kept as the Node.js Foundation signed it (ADR 0085), not re-signed ad hoc.
          codesign -dv --verbose=4 "$node" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          codesign -dv --verbose=4 "$node" 2>&1 | grep -q '^TeamIdentifier=HX7739G8FX$'
          codesign -d --entitlements - "$node"
          # Informational: whether Gatekeeper would accept the binary on its own.
          spctl --assess --type execute -vv "$node" || true
          npm run check:packaged -- --app "$app"
          ls -l out/*.dmg out/*.zip
          du -sh "$app" "$node"
      - name: Upload the hostile-render screenshots
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hostile-render-screenshots
          path: ${{ runner.temp }}/hostile-render
          if-no-files-found: ignore
      - name: Lint the Homebrew cask
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          # Audit needs the cask inside a tap: tap this checkout.
          brew tap bdchauvette/beuve "$PWD"
          # Homebrew 7.0.11 refuses to load casks from an untrusted tap.
          brew trust bdchauvette/beuve
          brew style --cask bdchauvette/beuve/beuve
          brew audit --cask --strict bdchauvette/beuve/beuve
