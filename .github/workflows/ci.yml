name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; beuve targets macOS (ADR 0049).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 45's Node (ADR 0007, 0048).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Lint the Homebrew cask
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          # Audit needs the cask inside a tap: tap this checkout.
          brew tap bdchauvette/beuve "$PWD"
          brew style --cask bdchauvette/beuve/beuve
          brew audit --cask --strict bdchauvette/beuve/beuve
