name: CI

# Skipped when a change touches only prose; docs.yml still checks its formatting (ADR 0094).
on:
  push:
    branches: [main]
    paths-ignore: &docs-only ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; beuve targets macOS (ADR 0049).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 for native Temporal in tests and tooling (ADR 0060).
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The reftable tests need git 2.45+ (ADR 0087); both runner images ship 2.56.
      - name: Show the git version
        run: git --version
      - run: npm run check
        env:
          # The reader's ref-backend tests must run on reftable here, not fall back to files.
          BEUVE_REQUIRE_REFTABLE: '1'
      # The app and the test-only harness page (dist-test/, never packaged) render the shared
      # hostile-input corpus with the production CSP and Trusted Types policy (ADR 0077).
      - name: Build the app and the hostile-input harness
        run: node scripts/build.ts --hostile-harness
      - name: Render the hostile-input corpus in the built app (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's AppArmor denies Chromium's sandbox the unprivileged user namespaces it
          # needs; allow them rather than run Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      - name: Render the hostile-input corpus in the built app (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      # The terminal panel runs a real shell through node-pty in the built app, under the production
      # policy: typing, output, the checkout, replay after hiding the panel (ADR 0095).
      - name: Run a shell in the built app's terminal panel (Linux)
        if: runner.os == 'Linux'
        run: |
          time xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-terminal.ts --screenshots "$RUNNER_TEMP/terminal"
      - name: Run a shell in the built app's terminal panel (macOS)
        if: runner.os == 'macOS'
        run: time node scripts/check-terminal.ts --screenshots "$RUNNER_TEMP/terminal"
      # The packaged app with the runAsNode fuse off and the bundled Node (ADR 0083-0085).
      - name: Package for Linux and check its fuses and bundled Node
        if: runner.os == 'Linux'
        run: |
          npm run dist:linux-dir
          npm run check:packaged -- --app out/linux-unpacked
          du -sh out/linux-unpacked out/linux-unpacked/resources/node/node
      - name: Package for macOS, verify signatures, fuses and bundled Node
        if: runner.os == 'macOS'
        env:
          # electron-builder skips signing in pull request builds, which leaves Electron's own
          # signature broken by the edits and fails the codesign checks below. This job has no
          # certificate or secrets, so the flag only makes pull requests get the same ad-hoc
          # signing that pushes get (ADR 0048).
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          npm run dist:mac
          app=out/mac-arm64/beuve.app
          node=$app/Contents/Resources/node/node
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$node"
          # Kept as the Node.js Foundation signed it (ADR 0085), not re-signed ad hoc.
          codesign -dv --verbose=4 "$node" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)'
          codesign -dv --verbose=4 "$node" 2>&1 | grep -q '^TeamIdentifier=HX7739G8FX$'
          codesign -d --entitlements - "$node"
          # Informational: whether Gatekeeper would accept the binary on its own.
          spctl --assess --type execute -vv "$node" || true
          npm run check:packaged -- --app "$app"
          ls -l out/*.dmg out/*.zip
          du -sh "$app" "$node"
      - name: Upload the hostile-render screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-render-screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/hostile-render
          if-no-files-found: ignore
      - name: Upload the terminal screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-screenshots-${{ runner.os }}
          path: ${{ runner.temp }}/terminal
          if-no-files-found: ignore
      - name: Lint the Homebrew cask
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          # Audit needs the cask inside a tap: tap this checkout.
          brew tap bdchauvette/beuve "$PWD"
          # Homebrew 7.0.11 refuses to load casks from an untrusted tap.
          brew trust bdchauvette/beuve
          brew style --cask bdchauvette/beuve/beuve
          brew audit --cask --strict bdchauvette/beuve/beuve
