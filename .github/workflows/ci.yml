name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon; beuve targets macOS (ADR 0049).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 26 for native Temporal in tests and tooling (ADR 0060).
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Render hostile file names and contents in the built app (ADR 0077)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04's AppArmor denies Chromium's sandbox the unprivileged user namespaces it
          # needs; allow them rather than run Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run build
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            node scripts/check-hostile-render.ts --screenshots "$RUNNER_TEMP/hostile-render"
      - name: Upload the hostile-render screenshots
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hostile-render-screenshots
          path: ${{ runner.temp }}/hostile-render
          if-no-files-found: ignore
      - name: Lint the Homebrew cask
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          brew --version
          # Audit needs the cask inside a tap: tap this checkout.
          brew tap bdchauvette/beuve "$PWD"
          # Homebrew 7.0.11 refuses to load casks from an untrusted tap.
          brew trust bdchauvette/beuve
          brew style --cask bdchauvette/beuve/beuve
          brew audit --cask --strict bdchauvette/beuve/beuve
