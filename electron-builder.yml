# Packaging (ADR 0048). Run through `npm run dist:mac` or `npm run dist:linux-dir`, which build first.
appId: dev.amoskeag.beuve
productName: beuve
copyright: Copyright © 2026 beuve contributors
directories:
  output: out
  buildResources: build
# Main, preload and ui are esbuild bundles (ADR 0007). The only node_modules main needs at run
# time are those it launches by path (ADR 0021, 0070); every other dependency is inside the bundles.
# Every file main loads or runs by path at run time must be listed here or in extraResources.
# `dist/main/impact-worker.js` (ADR 0053) and the sheet and Settings pages and preloads (ADR 0067,
# 0068) are dist files and load from the archive.
files:
  - dist/**
  - '!dist/**/*.map'
  - package.json
  - '!node_modules/**'
  # File sets rather than node_modules patterns: electron-builder drops every `*.d.ts` it collects
  # from node_modules, and tsserver needs `lib.*.d.ts`.
  - from: node_modules/typescript
    to: node_modules/typescript
    filter:
      - package.json
      - LICENSE.txt
      - lib/*.js
      - '!lib/{_tsc,tsc}.js'
      - lib/lib.*.d.ts
      - lib/typesMap.json
  - from: node_modules/typescript-language-server
    to: node_modules/typescript-language-server
    filter:
      - package.json
      - LICENSE
      - lib/cli.mjs
  # The Claude Code binary the Agent SDK runs when a model's executable is Bundled (ADR 0069,
  # 0070): the platform package npm installed (darwin-arm64 for the dmg, linux-x64 here).
  - from: node_modules/@anthropic-ai/claude-agent-sdk-${platform}-${arch}
    to: node_modules/@anthropic-ai/claude-agent-sdk-${platform}-${arch}
    filter:
      - claude
      - package.json
      - LICENSE.md
asar: true
# The Node that runs the TypeScript language server and trace probes (ADR 0083): the pinned
# nodejs.org binary (scripts/node-runtime.json, ADR 0084), which `npm run dist:*` fetches and
# verifies into vendor/node first. Main runs it as resources/node/node.
extraResources:
  - from: vendor/node/${platform}-${arch}/node
    to: node/node
# Run by path by the bundled Node, which can't read inside the archive (ADR 0021, 0083); tsserver
# also resolves its lib files only partly from there and reports wrong diagnostics.
asarUnpack:
  - node_modules/typescript/**
  - node_modules/typescript-language-server/**
  # A native executable inside app.asar can't be run.
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
# Nothing is native, so there is nothing to rebuild for Electron's ABI (ADR 0004).
npmRebuild: false
publish: null
# scripts/check-packaged-app.ts reads these back from the built binary; keep it in step.
electronFuses:
  # Off: nothing can run beuve's signed binary as a Node interpreter. Node children run the
  # bundled Node instead (ADR 0083).
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  # Apple silicon only (ADR 0048).
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  # Electron 44 and later require macOS 13 (Ventura).
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The bundled Node keeps the Node.js Foundation's Developer ID signature and its entitlements
  # rather than being re-signed with beuve's (ADR 0085).
  signIgnore:
    - Contents/Resources/node/node$
  icon: build/icon.icns
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
